name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Run test suite
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Summarize test run
        if: always()
        run: |
          summary="$(grep -E 'Test run with [0-9]+ test' "$RUNNER_TEMP/swift-test.log" | tail -1 || true)"
          summary="${summary:-swift test produced no run summary}"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
