name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"

      - name: Summarize test run
        if: always()
        run: |
          summary="$(grep -E '^.?.? ?Test run with .* (passed|failed)' "$RUNNER_TEMP/test-output.txt" | tail -1)"
          summary="${summary:-swift test produced no run summary}"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=swift test::${summary}"
